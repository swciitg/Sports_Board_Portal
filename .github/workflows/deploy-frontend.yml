name: Frontend Deploy

on:
  push:
    branches: [main]  # Deploy on every commit to main
  workflow_dispatch:  # Manual trigger

# Both deploys SSH into the same VM and share a checkout and the Docker
# config, so never let them run at the same time. Queue instead of cancelling:
# a half-finished deploy is worse than a slow one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-frontend:
    name: Building Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Establish ssh connection
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          script: |
            cd /webapps/Sports_Board_Portal/frontend
            sudo chown "$USER":"$USER" /home/"$USER"/.docker -R
            sudo chmod g+rwx "$HOME/.docker" -R
            git checkout main
            git fetch        
            git pull         
            docker compose -f docker-compose.yml up -d --build